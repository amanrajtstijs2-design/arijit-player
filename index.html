<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arijit Singh Mega Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #070b14; color: #f8fafc; font-family: system-ui, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-3 sm:p-6">

  <div class="w-full max-w-md glass rounded-3xl p-5 shadow-2xl border border-slate-800 flex flex-col gap-4">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center pt-1">
      <div>
        <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">5+ Hours Non-Stop</span>
        <h1 class="text-xl font-black text-white">Arijit Special Player</h1>
      </div>
      <a href="https://youtu.be/HB8HnAA_G2k" target="_blank" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-full flex items-center gap-1">
        <i class="fa-brands fa-youtube"></i> Open App
      </a>
    </div>

    <!-- Direct Embedded Video Frame -->
    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border border-slate-800 bg-black">
      <iframe 
        id="player-frame"
        class="w-full h-full"
        src="https://www.youtube.com/embed/HB8HnAA_G2k?playsinline=1&rel=0&modestbranding=1" 
        title="Arijit Singh Non-Stop"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Notice -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 flex items-start gap-2.5">
      <i class="fa-solid fa-circle-info text-emerald-400 mt-0.5"></i>
      <p>Gaana chalu karne ke liye <b>video screen ke center par tap karein</b>. Mobile security ki wajah se pehla tap screen par zaroori hota hai.</p>
    </div>

    <!-- Alternative Non-Stop Collections -->
    <div class="flex flex-col gap-2 mt-1">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">Other Working Non-Stop Hits</span>
      
      <button onclick="switchVideo('HB8HnAA_G2k', '70 Super Hits (5+ Hours)')" 
        class="bg-slate-900 hover:bg-slate-800 border border-emerald-500/40 p-3 rounded-xl flex items-center justify-between text-left transition">
        <div>
          <p class="text-sm font-bold text-white">Arijit 70 Super Hits (Zee Music)</p>
          <p class="text-xs text-slate-400">5+ Hours Non-Stop Magic</p>
        </div>
        <i class="fa-solid fa-play text-emerald-400 text-sm"></i>
      </button>

      <button onclick="switchVideo('284Ov7ysmfA', 'Best of Arijit Romantic')" 
        class="bg-slate-900 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-left transition">
        <div>
          <p class="text-sm font-bold text-white">Arijit Ultimate Romantic Hits</p>
          <p class="text-xs text-slate-400">Channa Mereya, Tum Hi Ho & More</p>
        </div>
        <i class="fa-solid fa-play text-slate-400 text-sm"></i>
      </button>

      <button onclick="switchVideo('BddP6PYo2gs', 'Arijit Latest 2024-2026 Hits')" 
        class="bg-slate-900 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-left transition">
        <div>
          <p class="text-sm font-bold text-white">Kesariya, Chaleya, Satranga</p>
          <p class="text-xs text-slate-400">Recent Superhits</p>
        </div>
        <i class="fa-solid fa-play text-slate-400 text-sm"></i>
      </button>
    </div>

  </div>

  <script>
    function switchVideo(id, title) {
      const iframe = document.getElementById('player-frame');
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
    }
  </script>
</body>
</html>
