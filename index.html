<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arijit Singh Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

  <div class="w-full max-w-md glass rounded-3xl p-6 shadow-2xl border border-slate-700/50 flex flex-col gap-6">
    <div class="text-center">
      <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold">Only Arijit Singh</span>
      <h1 class="text-2xl font-extrabold text-white mt-1">Arijit Tunes</h1>
    </div>

    <div class="relative w-full aspect-square rounded-2xl overflow-hidden shadow-lg border border-slate-700">
      <img id="track-art" src="https://img.youtube.com/vi/Umqb9KENgmk/hqdefault.jpg" alt="Song Cover" class="w-full h-full object-cover transition-transform duration-500" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4">
        <h2 id="track-title" class="text-xl font-bold truncate">Tum Hi Ho</h2>
        <p id="track-artist" class="text-sm text-slate-300">Aashiqui 2 • Arijit Singh</p>
      </div>
    </div>

    <div id="youtube-player" class="hidden"></div>

    <div class="flex items-center justify-center gap-6 my-2">
      <button onclick="prevSong()" class="p-3 text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-backward-step text-2xl"></i>
      </button>

      <button id="play-btn" onclick="togglePlay()" class="w-16 h-16 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
        <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
      </button>

      <button onclick="nextSong()" class="p-3 text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-forward-step text-2xl"></i>
      </button>
    </div>

    <div class="flex flex-col gap-2 max-h-52 overflow-y-auto pr-1">
      <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-1">Playlist</h3>
      <div id="playlist" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const songs = [
      {
        title: "Tum Hi Ho",
        movie: "Aashiqui 2",
        ytId: "Umqb9KENgmk",
        cover: "https://img.youtube.com/vi/Umqb9KENgmk/hqdefault.jpg"
      },
      {
        title: "Kesariya",
        movie: "Brahmastra",
        ytId: "BddP6PYo2gs",
        cover: "https://img.youtube.com/vi/BddP6PYo2gs/hqdefault.jpg"
      },
      {
        title: "Channa Mereya",
        movie: "Ae Dil Hai Mushkil",
        ytId: "284Ov7ysmfA",
        cover: "https://img.youtube.com/vi/284Ov7ysmfA/hqdefault.jpg"
      },
      {
        title: "O Bedardeya",
        movie: "Tu Jhoothi Main Makkaar",
        ytId: "ElZfdU54Cp8",
        cover: "https://img.youtube.com/vi/ElZfdU54Cp8/hqdefault.jpg"
      },
      {
        title: "Apna Bana Le",
        movie: "Bhediya",
        ytId: "ElZfdU54Cp8",
        cover: "https://img.youtube.com/vi/ElZfdU54Cp8/hqdefault.jpg"
      }
    ];

    let currentTrackIndex = 0;
    let player;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: songs[currentTrackIndex].ytId,
        playerVars: { playsinline: 1, controls: 0 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
      renderPlaylist();
      updateTrackUI();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayBtn();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayBtn();
      } else if (event.data === YT.PlayerState.ENDED) {
        nextSong();
      }
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      updateTrackUI();
      if (player && player.loadVideoById) {
        player.loadVideoById(songs[currentTrackIndex].ytId);
        isPlaying = true;
        updatePlayBtn();
      }
      renderPlaylist();
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextSong() {
      currentTrackIndex = (currentTrackIndex + 1) % songs.length;
      loadTrack(currentTrackIndex);
    }

    function prevSong() {
      currentTrackIndex = (currentTrackIndex - 1 + songs.length) % songs.length;
      loadTrack(currentTrackIndex);
    }

    function updateTrackUI() {
      const song = songs[currentTrackIndex];
      document.getElementById('track-title').innerText = song.title;
      document.getElementById('track-artist').innerText = `${song.movie} • Arijit Singh`;
      document.getElementById('track-art').src = song.cover;
    }

    function updatePlayBtn() {
      const icon = document.getElementById('play-icon');
      if (isPlaying) {
        icon.className = "fa-solid fa-pause text-2xl";
      } else {
        icon.className = "fa-solid fa-play text-2xl ml-1";
      }
    }

    function renderPlaylist() {
      const listContainer = document.getElementById('playlist');
      listContainer.innerHTML = '';
      songs.forEach((song, idx) => {
        const item = document.createElement('div');
        const isActive = idx === currentTrackIndex;
        item.className = `flex items-center gap-3 p-2 rounded-xl cursor-pointer transition ${isActive ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300' : 'hover:bg-slate-800 text-slate-300'}`;
        item.onclick = () => loadTrack(idx);
        item.innerHTML = `
          <img src="${song.cover}" class="w-10 h-10 rounded-lg object-cover" />
          <div class="flex-1 truncate">
            <p class="text-sm font-semibold truncate ${isActive ? 'text-emerald-300' : 'text-white'}">${song.title}</p>
            <p class="text-xs text-slate-400 truncate">${song.movie}</p>
          </div>
          ${isActive ? '<i class="fa-solid fa-volume-high text-xs text-emerald-400"></i>' : ''}
        `;
        listContainer.appendChild(item);
      });
    }
  </script>
</body>
</html>
