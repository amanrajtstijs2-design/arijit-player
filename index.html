<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arijit Singh Cloud Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #080d1a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); }
    input[type="range"]::-webkit-slider-thumb {
      width: 12px; height: 12px; border-radius: 50%; background: #10b981; appearance: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-3 sm:p-6">

  <div class="w-full max-w-md glass rounded-3xl p-5 shadow-2xl border border-slate-800 flex flex-col gap-4 relative">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center pt-1">
      <div>
        <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">JioSaavn Powered</span>
        <h1 class="text-xl font-black text-white">Arijit Cloud Stream</h1>
      </div>
      <div id="loading-badge" class="hidden text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full flex items-center gap-1.5">
        <i class="fa-solid fa-spinner fa-spin text-xs"></i> Loading...
      </div>
    </div>

    <!-- Album Art / Thumbnail -->
    <div class="relative w-full aspect-square rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
      <img id="track-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Song Cover" class="w-full h-full object-cover transition-all duration-300" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4">
        <h2 id="track-title" class="text-lg font-bold truncate text-white">Select a song</h2>
        <p id="track-artist" class="text-xs text-slate-300 truncate">Arijit Singh</p>
      </div>
    </div>

    <!-- Seekbar / Audio Progress -->
    <div class="flex flex-col gap-1 mt-1">
      <input type="range" id="seek-bar" value="0" min="0" step="1" oninput="seekAudio()" 
        class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
      <div class="flex justify-between text-[11px] text-slate-400 px-0.5">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-center gap-7 my-1">
      <button onclick="prevSong()" class="p-3 text-slate-400 hover:text-white transition active:scale-90">
        <i class="fa-solid fa-backward-step text-2xl"></i>
      </button>

      <button id="play-btn" onclick="togglePlay()" class="w-16 h-16 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
        <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
      </button>

      <button onclick="nextSong()" class="p-3 text-slate-400 hover:text-white transition active:scale-90">
        <i class="fa-solid fa-forward-step text-2xl"></i>
      </button>
    </div>

    <!-- Live Search Bar -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
      <input type="text" id="search-box" onkeypress="handleSearch(event)" placeholder="Search any Arijit song (e.g. Gerua, Zaalima)..." 
        class="w-full bg-slate-900 border border-slate-700/80 rounded-xl py-2 pl-9 pr-14 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500" />
      <button onclick="triggerSearch()" class="absolute right-2 top-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg">Go</button>
    </div>

    <!-- Playlist Section -->
    <div class="flex flex-col gap-2">
      <div class="flex justify-between items-center text-xs text-slate-400 font-semibold uppercase px-1">
        <span>Arijit Tracks (<span id="total-songs">0</span>)</span>
      </div>
      <div id="playlist" class="flex flex-col gap-2 max-h-56 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <audio id="audio-engine" preload="metadata"></audio>

  <script>
    const audio = document.getElementById('audio-engine');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeText = document.getElementById('current-time');
    const totalDurationText = document.getElementById('total-duration');
    const playIcon = document.getElementById('play-icon');
    const loadingBadge = document.getElementById('loading-badge');

    let songs = [];
    let currentTrackIndex = 0;
    let isPlaying = false;

    // Load initial 50 Arijit Singh hits on start
    window.addEventListener('DOMContentLoaded', () => {
      fetchArijitSongs("Arijit Singh");
    });

    async function fetchArijitSongs(query) {
      showLoading(true);
      try {
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&page=1&limit=50`);
        const data = await res.json();
        
        if (data.success && data.data.results.length > 0) {
          songs = data.data.results.map(item => {
            // Find highest quality audio stream
            const audioObj = item.downloadUrl ? (item.downloadUrl[4] || item.downloadUrl[3] || item.downloadUrl[0]) : null;
            // Find highest quality album art
            const imgObj = item.image ? (item.image[2] || item.image[1] || item.image[0]) : null;

            return {
              title: decodeHTMLEntities(item.name || "Unknown"),
              movie: decodeHTMLEntities((item.album && item.album.name) ? item.album.name : "Single"),
              cover: imgObj ? imgObj.url : "https://img.youtube.com/vi/Umqb9KENgmk/hqdefault.jpg",
              url: audioObj ? audioObj.url : ""
            };
          }).filter(s => s.url !== ""); // Filter out broken tracks

          document.getElementById('total-songs').innerText = songs.length;
          renderPlaylist();
          if (songs.length > 0) {
            selectTrack(0, false);
          }
        }
      } catch (err) {
        console.error("API Fetch Error:", err);
      } finally {
        showLoading(false);
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist');
      container.innerHTML = '';
      
      songs.forEach((song, idx) => {
        const isActive = idx === currentTrackIndex;
        const item = document.createElement('div');
        item.className = `flex items-center gap-3 p-2 rounded-xl cursor-pointer transition ${isActive ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300' : 'hover:bg-slate-800/60 text-slate-300'}`;
        item.onclick = () => selectTrack(idx, true);
        item.innerHTML = `
          <img src="${song.cover}" class="w-10 h-10 rounded-lg object-cover shadow" />
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold truncate ${isActive ? 'text-emerald-300' : 'text-white'}">${song.title}</p>
            <p class="text-xs text-slate-400 truncate">${song.movie}</p>
          </div>
          ${isActive ? '<i class="fa-solid fa-volume-high text-xs text-emerald-400"></i>' : ''}
        `;
        container.appendChild(item);
      });
    }

    function selectTrack(index, autoplay = true) {
      if (!songs[index]) return;
      currentTrackIndex = index;
      const song = songs[currentTrackIndex];

      document.getElementById('track-title').innerText = song.title;
      document.getElementById('track-artist').innerText = `${song.movie} • Arijit Singh`;
      document.getElementById('track-art').src = song.cover;

      audio.src = song.url;
      audio.load();

      // Lock Screen Controls (MediaSession API)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title,
          artist: "Arijit Singh",
          album: song.movie,
          artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', togglePlay);
        navigator.mediaSession.setActionHandler('pause', togglePlay);
        navigator.mediaSession.setActionHandler('previoustrack', prevSong);
        navigator.mediaSession.setActionHandler('nexttrack', nextSong);
      }

      renderPlaylist();

      if (autoplay) {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayBtn();
        }).catch(err => console.log(err));
      }
    }

    function togglePlay() {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play();
        isPlaying = true;
      }
      updatePlayBtn();
    }

    function nextSong() {
      currentTrackIndex = (currentTrackIndex + 1) % songs.length;
      selectTrack(currentTrackIndex, true);
    }

    function prevSong() {
      currentTrackIndex = (currentTrackIndex - 1 + songs.length) % songs.length;
      selectTrack(currentTrackIndex, true);
    }

    function updatePlayBtn() {
      if (isPlaying) {
        playIcon.className = "fa-solid fa-pause text-2xl";
      } else {
        playIcon.className = "fa-solid fa-play text-2xl ml-1";
      }
    }

    // Audio Timeline & Seekbar
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        seekBar.max = Math.floor(audio.duration);
        seekBar.value = Math.floor(audio.currentTime);
        currentTimeText.innerText = formatTime(audio.currentTime);
        totalDurationText.innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', nextSong);

    function seekAudio() {
      audio.currentTime = seekBar.value;
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function handleSearch(e) {
      if (e.key === 'Enter') triggerSearch();
    }

    function triggerSearch() {
      const q = document.getElementById('search-box').value.trim();
      if (q) {
        fetchArijitSongs("Arijit Singh " + q);
      } else {
        fetchArijitSongs("Arijit Singh");
      }
    }

    function showLoading(show) {
      if (show) loadingBadge.classList.remove('hidden');
      else loadingBadge.classList.add('hidden');
    }

    function decodeHTMLEntities(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }
  </script>
</body>
</html>
